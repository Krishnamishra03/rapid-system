name: Build iOS .app & .ipa (MobAI iOS Builder)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS App Payload
        run: flutter build ios --release --no-codesign

      - name: Package .app Bundle & .ipa Payload
        run: |
          mkdir -p dist
          # Package .app bundle zip
          cd build/ios/iphoneos
          zip -r -9 ../../../dist/rapid_smart_attendance.app.zip Runner.app
          cd ../../../
          # Package .ipa payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 dist/rapid_smart_attendance.ipa Payload

      - name: Upload iOS .app Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapid_smart_attendance-ios-app-bundle
          path: dist/rapid_smart_attendance.app.zip

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapid_smart_attendance-ios-ipa
          path: dist/rapid_smart_attendance.ipa
