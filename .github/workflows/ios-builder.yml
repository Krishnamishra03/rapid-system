name: Build iPhone 16 Pro Simulator .app (MobAI iOS Builder)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iphone-16-pro:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iPhone 16 Pro Simulator .app Bundle
        run: flutter build ios --simulator --no-codesign

      - name: Package iPhone 16 Pro .app Bundle
        run: |
          mkdir -p dist
          cd build/ios/iphonesimulator
          zip -r -9 ../../../dist/iphone_16_pro_runner.app.zip Runner.app
          cd ../../../

      - name: Upload iPhone 16 Pro Simulator .app Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-16-Pro-Simulator-App-Bundle
          path: dist/iphone_16_pro_runner.app.zip
